# Machine-readable curriculum manifest for the Learning Mentor integration.
# This file is the single authority for semantic IDs, prerequisites, outcomes,
# learner and reference paths, focused commands, and solution-lock ownership.
# See references/course-schema.md for the contract this instance must satisfy.
#
# COMPLETE CURRICULUM: every unit whose content exists is registered here, and
# every planned unit now exists. Modules 1 through 12 -- from choosing a data
# primitive through securing and operating the live architecture -- are built and
# registered below, together with the Field Station project that applies all
# three Storage services and the Cloud Expedition Field Journal capstone that
# integrates all five. The capstone is the single required final destination.
#
# The whole curriculum -- 12 modules, one applied project, and the capstone, with
# their graph, outcomes, and evidence records -- lives in curriculum_plan below
# and is checked by tools/CourseVerifier. A unit may be registered here only once
# the plan marks its artifacts as present, which is what stops the mentor from
# recording progress against content that does not exist. The verifier enforces
# the other direction: content that lands without a plan update, or a plan
# promoted without registration here, fails the build.

manifest_version = 1
schema_version = "1.0.0"
schema_document = ".agents/skills/azure-learning-path/references/course-schema.md"
curriculum_plan = "docs/architecture/curriculum.json"

[course]
id = "learning-azure"
version = "0.5.0"
title = "Learning Azure Data and Messaging"
description = "A narrative-driven, hands-on course teaching Azure Blob, Queue, and Table Storage, Event Hubs, and Azure Cosmos DB for NoSQL with C# and .NET 10 through one continuing story, the Cloud Expedition Field Journal. Twelve modules, an applied Storage project, and a capstone that integrates all five services end to end."
language = "csharp"
target_framework = "net10.0"
dotnet_sdk_minimum = "10.0"
learner_entry_point = "README.md"
setup_guide = "docs/SETUP.md"
command_working_directory = "."
final_destinations = [{ id = "capstone.cloud-expedition-journal", path = "capstones/cloud-expedition-journal/README.md", required = true }]

[[modules]]
id = "module.azure-data-map"
ordinal = 1
title = "Choose the right Azure data primitive"
prerequisites = []
required_outcomes = [
  "Choose the Azure data primitive that fits a stated expedition requirement and justify it against the adjacent service.",
  "Compare durability, ordering, partitioning, replay, and cost characteristics across blob, queue, table, event stream, and document storage.",
  "Apply resource-group scoping, safe naming, and teardown rules to a planned expedition deployment so every later unit stays reproducible.",
]
lesson_readme = "lessons/01-azure-data-map/README.md"
exercise_starter = "exercises/01-azure-data-map/starter"
exercise_solution = "exercises/01-azure-data-map/solution"
solution_supplements = ["exercises/01-azure-data-map/tests"]
review_questions = { path = "lessons/01-azure-data-map/README.md", heading = "Review questions" }
