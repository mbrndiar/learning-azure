# The project locks only its reference implementation. The evaluator stays
# visible on purpose: it is the specification the learner works against, and the
# milestone commands are meaningless if the assertions are hidden. The unlock
# threshold is higher than a module's because a project milestone is a longer
# piece of work, and comparing after two attempts would be comparing too early.
[[solution_lock_groups]]
id = "solutions.field-station"
paths = ["projects/field-station/solution"]
unlock_policy = "after-matching-milestone-validation"
solution_unlock_after = 3

# The capstone locks its reference implementation on the same terms as the
# project, and for the same reason: the evaluator is the specification, so it
# stays visible while the answer does not. Its end-to-end host is part of the
# reference tree, so unlocking it early would hand over the whole integration.
[[solution_lock_groups]]
id = "solutions.cloud-expedition-journal"
paths = ["capstones/cloud-expedition-journal/solution"]
unlock_policy = "after-matching-milestone-validation"
solution_unlock_after = 3
