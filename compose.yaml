# Local emulator stack (`compose.yaml`)
#
# Bootstrap skeleton for the Cloud Expedition Field Journal. This brings up the
# free, local Azure emulators the course uses so lessons run without a live
# Azure subscription. Images are pinned by tag; the pins here match the tags
# documented in docs/COST-AND-CLEANUP.md.
#
# NON-PARITY: emulators approximate — never a substitute for — their Azure
# services. Live checkpoints (documented per lesson, later stages) are the only
# place real Azure resources are provisioned.
#
# EULA: the Event Hubs emulator requires explicit license acceptance. It stays
# down until you set ACCEPT_EULA=Y in your shell (or .env). The default (N)
# fails closed on purpose.
#
# Bring up:    ACCEPT_EULA=Y docker compose up -d
# Tear down:   docker compose down -v
# Validate:    docker compose config
#
# Cosmos runs in HTTPS mode because the Azure SDKs require it; configure the
# .NET client to trust the emulator certificate for local development (see
# docs/SETUP.md). The readiness probe on port 8080 is plain HTTP.

name: learning-azure-local

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    container_name: learning-azure-azurite
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
      - --skipApiVersionCheck
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
      - "10002:10002" # Table
    volumes:
      - azurite-data:/data
    networks:
      - expedition
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:10000/',r=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  eventhubs:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:2.2.1
    container_name: learning-azure-eventhubs
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
    ports:
      - "5672:5672" # AMQP
      - "9092:9092" # Kafka
    volumes:
      - ./infra/local/eventhubs/config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    networks:
      - expedition
    depends_on:
      azurite:
        condition: service_healthy

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20260706
    container_name: learning-azure-cosmos
    environment:
      PROTOCOL: https
    ports:
      - "8081:8081" # Gateway
      - "8080:8080" # Readiness probe (HTTP)
      - "1234:1234" # Data Explorer
    volumes:
      - cosmos-data:/data
    networks:
      - expedition
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/ready
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

networks:
  expedition:
    driver: bridge

volumes:
  azurite-data:
  cosmos-data:
